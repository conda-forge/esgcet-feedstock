context:
  name: esgcet
  version: "5.5.4"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/esgcet-${{ version }}.tar.gz
  sha256: af31a7cb72bc7d7c5389875d4aada19ec728a8688f3bd4fad37b70ac1dfc8f5f

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv
  python:
    entry_points:
      - esgpidcitepub = esgcet.cli.esgpidcitepub:main
      - esgmkpubrec = esgcet.cli.esgmkpubrec:main
      - esgindexpub = esgcet.cli.esgindexpub:main
      - esgpublish = esgcet.pub_internal:main
      - esgupdate = esgcet.cli.esgupdate:main
      - esgmapconv = esgcet.cli.esgmapconv:main
      - esgunpublish = esgcet.cli.esgunpublish:main
      - esgcet = esgcet.cli:app
      - esglogin = esgcet.cli.esglogin:main
      - esgadd = esgcet.cli.esgstacaddrep:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=45
    - wheel
  run:
    - python >=${{ python_min }},<3.15
    - requests
    - esgfpid
    - xarray
    - netcdf4
    - dask
    - distributed
    - pyyaml
    - cc-plugin-wcrp >=2.0.0
    - pystac-client
    - kerchunk
    - virtualizarr
    - esgvoc >=5.0.1
    - pydantic
    - typer
    - attrs
    - h5py
    - globus-cli
    - globus-sdk >=4.3.0
    - scipy >=1.15.3
    - fastparquet >=2026.5.0
    - duckdb >=1.5.5

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - esgcet
        - esgcet.cli
        - esgcet.project
        - esgcet.scan
        - esgcet.stac
      pip_check: true
  - script:
      - esgpublish --version
      - esgcet --help

about:
  homepage: http://esgf.github.io/
  summary: ESGCET publication package
  description: |
    Publishing client for the Earth System Grid Federation (ESGF).
    ESGCET provides tools for publishing climate model output data to ESGF
    data nodes, including metadata extraction, dataset validation, and
    publication to STAC catalogs and Solr indexes.
  license: BSD-3-Clause
  license_file: bsd-3-clause.txt
  documentation: https://esg-publisher.readthedocs.io/
  repository: https://github.com/ESGF/esg-publisher

extra:
  recipe-maintainers:
    - cofinoa
    - sashakames
